name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/pitchgenie-ci
      E2E_DATABASE_URL: mongodb://127.0.0.1:27017/pitchgenie-e2e
      NEXTAUTH_URL: https://ci.example.com
      NEXTAUTH_SECRET: ci-only-secret-that-is-long-enough-for-tests
      OPENROUTER_API_KEY: ci-only-placeholder-key
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_pro
      STRIPE_ENTERPRISE_PRICE_ID: price_ci_enterprise
      STRIPE_BILLING_ENABLED: "false"
      HEALTHCHECK_EXTERNAL_SERVICES: "false"
      HEALTHCHECK_EXPORT_RUNTIME: "true"
      HEALTHCHECK_DATABASE_INDEXES: "true"
      BUILD_SHA: ${{ github.sha }}
      RATE_LIMIT_STORE: mongodb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate MongoDB schema
        run: pnpm db:deploy

      - name: Prepare isolated E2E MongoDB schema
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Chromium executable
        run: echo "CHROMIUM_EXECUTABLE_PATH=$(pnpm exec node -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Smoke test production server
        run: |
          pnpm exec next start -p 3100 > /tmp/pitchgenie-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health/live > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3100/api/health/live > /dev/null
          curl --fail --silent http://127.0.0.1:3100/api/health/ready > /dev/null
          curl --fail --silent http://127.0.0.1:3100/pricing > /dev/null

      - name: Run Chromium smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
